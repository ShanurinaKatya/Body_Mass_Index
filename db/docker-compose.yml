services:
  postgres:
    container_name: body_mass_index_db
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: body_mass_index
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    container_name: body_mass_index_adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
