<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог расчётов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;">
    <header class="page-header">
        <h1 class="page-title">Каталог расчётов</h1>
        <p class="page-subtitle">Специализированные калькуляторы ИМТ</p>

        <form action="/cards" method="GET" class="cards-filter" id="filterForm">
            <label class="cards-filter-label">Фильтр по возрасту</label>
            <div class="cards-filter-track">
                <input type="range" name="age" min="0" max="100" value="{{ if .age }}{{ .age }}{{ else }}0{{ end }}" class="cards-filter-input" id="ageSlider">
                <div class="cards-filter-range-labels">
                    <span>0</span>
                    <span id="ageBubble" class="cards-filter-bubble">{{ if .age }}{{ .age }}{{ else }}0{{ end }}</span>
                    <span>100</span>
                </div>
            </div>
        </form>
    </header>

    <div class="cards-container">
        <div class="cards-grid">
            {{ range .services }}
            <div class="card">
                <a href="/feed?id={{ .ID }}">
                    <img class="card-image" src="{{ $.minio }}/{{ .ImageKey }}" alt="{{ .Title }}">
                    <div class="card-content">
                        <h3 class="card-title">{{ .Title }}</h3>
                        <div class="card-row">
                            <div class="card-likes">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.28 2 8.5C2 5.42 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.09C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.42 22 8.5C22 12.28 18.6 15.36 13.45 20.04L12 21.35Z" stroke="#e43f44" stroke-width="1.5" fill="none"/>
                                </svg>
                                <span style="color:#333333;">{{ len .Likes }}</span>
                            </div>
                            <span class="card-meta">{{ .Weight }} кг</span>
                            <span class="card-meta">{{ .Age }} лет</span>
                        </div>
                    </div>
                </a>
            </div>
            {{ end }}
        </div>
    </div>

    <nav class="tab-bar">
        <a href="/" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9 21V14H15V21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Лента</span>
        </a>
        <a href="/add" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Добавить</span>
        </a>
        <a href="/cards" class="tab-item active">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Плитка</span>
        </a>
    </nav>
    <script>
        var slider = document.getElementById('ageSlider');
        var bubble = document.getElementById('ageBubble');
        var form = document.getElementById('filterForm');

        function updateBubble() {
            var val = parseInt(slider.value);
            var min = parseInt(slider.min);
            var max = parseInt(slider.max);
            var percent = ((val - min) / (max - min)) * 100;
            var trackRect = slider.getBoundingClientRect();
            var thumbWidth = 24;
            var thumbCenterX = (thumbWidth / 2) + (percent / 100) * (trackRect.width - thumbWidth);
            var bubbleLeft = (thumbCenterX / trackRect.width) * 100;
            bubble.textContent = val;
            bubble.style.left = bubbleLeft + '%';
        }

        slider.addEventListener('input', updateBubble);
        updateBubble();

        slider.addEventListener('change', function() {
            form.submit();
        });
    </script>
</body>
</html>
