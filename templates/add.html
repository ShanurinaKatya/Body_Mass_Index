<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новый расчёт ИМТ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;">
    <header class="page-header">
        <h1 class="page-title">Новый расчёт ИМТ</h1>
    </header>

    <div class="add-container">
        <div class="add-placeholders">
            <div class="add-placeholder" onclick="document.getElementById('cover-input').click()">
                <span>Обложка</span>
                <input type="file" id="cover-input" accept="image/*" hidden>
            </div>
            <div class="add-placeholder" onclick="document.getElementById('video-input').click()">
                <span>Видео</span>
                <input type="file" id="video-input" accept="video/*" hidden>
            </div>
        </div>

        <div class="add-field">
            <label class="add-field-label">Название расчёта</label>
            <input type="text" class="add-input" value="{{ .service.Title }}">
        </div>

        <div class="add-field">
            <label class="add-field-label">Описание</label>
            <textarea class="add-textarea">{{ .service.Description }}</textarea>
        </div>

        <div class="add-field">
            <label class="add-field-label">Возраст пациента</label>
            <input type="number" class="add-input" value="{{ .service.Age }}" min="1" step="1" onkeydown="blockBad(event, this)" oninput="clampPositive(this, 1)">
        </div>

        <div class="add-field">
            <label class="add-field-label">Пол</label>
            <div class="add-gender-toggle">
                <div class="add-gender-btn {{ if eq .service.Gender "Мужской" }}active{{ end }}" onclick="selectGender(this)">Мужской</div>
                <div class="add-gender-btn {{ if eq .service.Gender "Женский" }}active{{ end }}" onclick="selectGender(this)">Женский</div>
            </div>
        </div>

        <div class="add-row">
            <div class="add-field">
                <label class="add-field-label">Вес (кг)</label>
                <input type="number" class="add-input" value="{{ .service.Weight }}" min="0.1" step="0.1" onkeydown="blockBad(event, this)" oninput="clampPositive(this, 0.1)">
            </div>
            <div class="add-field">
                <label class="add-field-label">Рост (см)</label>
                <input type="number" class="add-input" value="{{ .service.Height }}" min="1" step="1" onkeydown="blockBad(event, this)" oninput="clampPositive(this, 1)">
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="/" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9 21V14H15V21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Лента</span>
        </a>
        <a href="/add" class="tab-item active">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Добавить</span>
        </a>
        <a href="/cards" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Плитка</span>
        </a>
    </nav>
    <script>
        function selectGender(el) {
            var btns = document.querySelectorAll('.add-gender-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            el.classList.add('active');
        }

        function blockBad(e, el) {
            var blocked = ['-', '+', 'e', 'E'];
            if (blocked.indexOf(e.key) !== -1) { e.preventDefault(); return; }
            if (e.key === '.' && el.step && el.step.indexOf('.') === -1) { e.preventDefault(); }
        }

        function clampPositive(el, min) {
            var v = parseFloat(el.value);
            if (!isNaN(v) && v < min) el.value = min;
        }
    </script>
</body>
</html>
