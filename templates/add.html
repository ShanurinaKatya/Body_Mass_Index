<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новый расчёт ИМТ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;">
    <header class="page-header">
        <h1 class="page-title">Новый расчёт ИМТ</h1>
    </header>

    <div class="add-container">
        <div class="add-placeholders">
            <label class="add-placeholder">
                <span class="add-placeholder-text">Обложка</span>
                <img class="add-preview" alt="Превью обложки">
                <input type="file" class="add-file-input" accept="image/*" hidden>
            </label>
            <label class="add-placeholder">
                <span class="add-placeholder-text">Видео</span>
                <video class="add-preview" muted playsinline></video>
                <input type="file" class="add-file-input" accept="video/*" hidden>
            </label>
        </div>

        <div class="add-field">
            <label class="add-field-label">Название расчёта</label>
            <input type="text" class="add-input" value="{{ .service.Title }}">
        </div>

        <div class="add-field">
            <label class="add-field-label">Описание</label>
            <textarea class="add-textarea">{{ .service.Description }}</textarea>
        </div>

        <div class="add-field">
            <label class="add-field-label">Возраст пациента</label>
            <input type="number" class="add-input" value="{{ .service.Age }}" min="1" step="1">
        </div>

        <div class="add-field">
            <label class="add-field-label">Пол</label>
            <div class="add-gender-toggle">
                <input type="radio" name="gender" id="gender-male" class="add-gender-radio" {{ if eq .service.Gender "Мужской" }}checked{{ end }}>
                <label for="gender-male" class="add-gender-btn">Мужской</label>
                <input type="radio" name="gender" id="gender-female" class="add-gender-radio" {{ if eq .service.Gender "Женский" }}checked{{ end }}>
                <label for="gender-female" class="add-gender-btn">Женский</label>
            </div>
        </div>

        <div class="add-row">
            <div class="add-field">
                <label class="add-field-label">Вес (кг)</label>
                <input type="number" class="add-input" value="{{ .service.Weight }}" min="0.1" step="0.1">
            </div>
            <div class="add-field">
                <label class="add-field-label">Рост (см)</label>
                <input type="number" class="add-input" value="{{ .service.Height }}" min="1" step="1">
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="/feed" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9 21V14H15V21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Лента</span>
        </a>
        <a href="/add" class="tab-item active">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Добавить</span>
        </a>
        <a href="/cards" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Плитка</span>
        </a>
    </nav>
    <script>
        var placeholders = document.querySelectorAll('.add-placeholder');
        for (var i = 0; i < placeholders.length; i++) {
            (function (ph) {
                var input = ph.querySelector('input[type="file"]');
                input.addEventListener('change', function () {
                    var file = input.files[0];
                    if (!file) { return; }
                    var isImage = input.accept.indexOf('image') !== -1;
                    var preview = ph.querySelector('.add-preview');
                    var url = URL.createObjectURL(file);
                    preview.src = url;
                    preview.style.display = 'block';
                    if (!isImage) {
                        preview.load && preview.load();
                    }
                    ph.classList.add('has-preview');
                });
            })(placeholders[i]);
        }
    </script>
</body>
</html>
