<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новый расчёт ИМТ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/patients_categories.css">
</head>
<body style="user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;">
    <header class="page-header">
        <h1 class="page-title">Новый расчёт ИМТ</h1>
    </header>

    {{ if .draft }}
    <form action="/publish" method="POST" class="add-container">
        <input type="hidden" name="calculation_id" value="{{ .draft.ID }}">
        <input type="hidden" name="name" value="{{ .draft.Name }}">

        <div class="add-placeholders">
            <div class="add-placeholder{{ if .draft.ImageURL }} has-preview{{ end }}" id="coverPlaceholder">
                {{ if .draft.ImageURL }}
                <img class="add-preview" src="{{ .draft.ImageURL }}" alt="Обложка">
                {{ else }}
                <img class="add-preview" alt="Обложка">
                {{ end }}
                <span class="add-placeholder-text">Обложка</span>
            </div>
            <div class="add-placeholder{{ if .draft.VideoURL }} has-preview{{ end }}" id="videoPlaceholder">
                {{ if .draft.VideoURL }}
                <video class="add-preview" src="{{ .draft.VideoURL }}" muted playsinline></video>
                {{ else }}
                <video class="add-preview" muted playsinline></video>
                {{ end }}
                <span class="add-placeholder-text">Видео</span>
            </div>
        </div>

        <div class="add-field">
            <label class="add-field-label">Название расчёта</label>
            <div class="add-name-readonly">{{ .draft.Name }}</div>
        </div>

        <div class="add-field">
            <label class="add-field-label">Описание</label>
            <textarea name="description" class="add-textarea">{{ .draft.Description }}</textarea>
        </div>

        <div class="add-field">
            <label class="add-field-label">Возраст пациента</label>
            <input type="number" name="age" class="add-input" value="{{ if .draft.Age }}{{ .draft.Age }}{{ end }}" min="1" step="1" required>
        </div>

        <div class="add-field">
            <label class="add-field-label">Пол</label>
            <div class="add-gender-toggle">
                <input type="radio" name="gender" id="gender-male" value="Male" class="add-gender-radio" {{ if eq .draft.Gender "Male" }}checked{{ end }}>
                <label for="gender-male" class="add-gender-btn">Мужской</label>
                <input type="radio" name="gender" id="gender-female" value="Female" class="add-gender-radio" {{ if eq .draft.Gender "Female" }}checked{{ end }}>
                <label for="gender-female" class="add-gender-btn">Женский</label>
            </div>
        </div>

        <div class="add-row">
            <div class="add-field">
                <label class="add-field-label">Вес (кг)</label>
                <input type="number" name="weight" class="add-input" value="{{ if .draft.Weight }}{{ .draft.Weight }}{{ end }}" min="0.1" step="0.1" required>
            </div>
            <div class="add-field">
                <label class="add-field-label">Рост (см)</label>
                <input type="number" name="height" class="add-input" value="{{ if .draft.Height }}{{ .draft.Height }}{{ end }}" min="1" step="1" required>
            </div>
        </div>

        <button type="submit" class="add-submit-btn">Опубликовать</button>
    </form>
    {{ else }}
    <form action="/add" method="POST" class="add-container">
        <div class="add-placeholders">
            <div class="add-placeholder" id="coverPlaceholder">
                <img class="add-preview" alt="Обложка">
                <span class="add-placeholder-text">Обложка</span>
            </div>
            <div class="add-placeholder" id="videoPlaceholder">
                <video class="add-preview" muted playsinline></video>
                <span class="add-placeholder-text">Видео</span>
            </div>
        </div>
        <input type="file" id="coverFile" accept="image/*" class="add-file-input" hidden>
        <input type="file" id="videoFile" accept="video/*" class="add-file-input" hidden>

        <div class="add-field">
            <label class="add-field-label">Название расчёта</label>
            <input type="text" name="name" class="add-input" placeholder="Например, ИМТ для подростков" required>
        </div>

        <button type="submit" class="add-submit-btn">Далее</button>
    </form>
    {{ end }}

    <nav class="tab-bar">
        <a href="/feed" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9 21V14H15V21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Лента</span>
        </a>
        <a href="/add" class="tab-item active">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Добавить</span>
        </a>
        <a href="/cards" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Плитка</span>
        </a>
    </nav>
    <script>
        (function () {
            var COVER_KEY = 'bmi_cover_data';
            var VIDEO_KEY = 'bmi_video_data';

            var coverBox = document.getElementById('coverPlaceholder');
            var videoBox = document.getElementById('videoPlaceholder');

            function showPreview(box, source) {
                if (!box) return;
                var preview = box.querySelector('.add-preview');
                if (!preview) return;
                preview.setAttribute('src', source);
                if (preview.tagName === 'VIDEO') {
                    preview.load();
                }
                box.classList.add('has-preview');
            }

            function applyStored() {
                var cover = sessionStorage.getItem(COVER_KEY);
                var video = sessionStorage.getItem(VIDEO_KEY);
                if (cover) showPreview(coverBox, cover);
                if (video) showPreview(videoBox, video);
            }

            function wireFileInput(inputId, box, key) {
                var input = document.getElementById(inputId);
                if (!input || !box) return;
                box.addEventListener('click', function () {
                    input.click();
                });
                input.addEventListener('change', function () {
                    var file = input.files && input.files[0];
                    if (!file) return;
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var data = e.target.result;
                        sessionStorage.setItem(key, data);
                        showPreview(box, data);
                    };
                    reader.readAsDataURL(file);
                });
            }

            wireFileInput('coverFile', coverBox, COVER_KEY);
            wireFileInput('videoFile', videoBox, VIDEO_KEY);
            applyStored();
        })();
    </script>
</body>
</html>
